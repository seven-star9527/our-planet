services:
  db:
    image: ankane/pgvector:latest
    container_name: our_planet_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-our_planet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-our_planet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: our_planet_web
    restart: always
    # 去掉 ports 暴露，仅通过内部网络访问（安全）
    env_file:
      - prisma/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-our_planet}?schema=public
    volumes:
      # 持久化保存用户上传到服务器自带磁盘的照片
      - ./uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: our_planet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  pgdata:
